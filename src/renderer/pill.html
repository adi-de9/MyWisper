<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' file:; style-src 'self' 'unsafe-inline'">
  <title>MyWisper pill</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    /* The window is sized to the content by main.js. The pill sits at the bottom (or top) edge;
       the menu opens into the space above (or below) it. */
    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; padding: 8px;
      box-sizing: border-box; font: 500 13px/1 var(--font-sans); color: var(--fg); -webkit-font-smoothing: antialiased; }
    body.top { flex-direction: column-reverse; justify-content: flex-end; }
    .pill, .menu { flex: none; }

    /* ---- the capsule: morphs between an idle bar and the full pill ---- */
    .pill { all: unset; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px;
      height: 38px; padding: 0 14px; overflow: hidden; white-space: nowrap;
      border-radius: 999px; background: var(--bg); border: 1px solid var(--line-2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
      transition: width .18s cubic-bezier(.2, .8, .2, 1), height .18s cubic-bezier(.2, .8, .2, 1),
        padding .18s, background-color .15s, border-color .15s, opacity .2s; }
    .pill.no-anim, .pill.no-anim * { transition: none !important; }
    .pill > * { display: none; flex: none; }

    /* idle: a small 40 × 7 bar */
    .pill[data-state="idle"], .pill[data-state="off"] { width: 40px; height: 7px; padding: 0; border-color: rgba(255, 255, 255, .28);
      background: rgba(10, 10, 10, .72); box-shadow: 0 1px 4px rgba(0, 0, 0, .35); cursor: pointer; }
    .pill[data-state="off"] { opacity: 0; }
    /* hover on the bar: hint */
    .pill[data-state="hint"] { cursor: pointer; }
    .pill[data-state="hint"] .mark, .pill[data-state="hint"] .label { display: inline-flex; }
    .pill[data-state="hint"] .label { color: var(--fg-2); }
    .pill[data-state="hint"] kbd { margin: 0 1px; }
    /* recording */
    .pill[data-state="recording"] .dot, .pill[data-state="recording"] canvas, .pill[data-state="recording"] .timer { display: block; }
    /* processing */
    .pill[data-state="processing"] .spinner, .pill[data-state="processing"] .label { display: block; }
    /* error / info message */
    .pill[data-state="error"] .label { display: block; color: var(--red); }
    .pill[data-state="error"] { border-color: color-mix(in srgb, var(--red) 55%, var(--line-2)); }
    .pill[data-state="info"] .label { display: block; color: var(--fg-2); }
    /* text selected: MyWisper · Rewrite (the whole pill is the button) */
    .pill[data-state="select"] { cursor: pointer; padding: 0 10px 0 12px; gap: 8px; }
    .pill[data-state="select"] .mark, .pill[data-state="select"] .label, .pill[data-state="select"] .sep,
    .pill[data-state="select"] .rewrite { display: flex; }
    .pill[data-state="select"]:hover, .pill.open { background: var(--bg-3); border-color: #444; }
    /* waiting for a spoken instruction */
    .pill[data-state="await"] { padding: 0 6px 0 12px; gap: 8px; }
    .pill[data-state="await"] .mark, .pill[data-state="await"] .label, .pill[data-state="await"] .cancel { display: flex; }
    .pill[data-state="await"] .mark { color: var(--red); animation: pulse 1.2s ease-in-out infinite; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
    .timer { color: var(--fg-2); font-size: 12px; min-width: 30px; }
    .spinner { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--line-2); border-top-color: var(--fg); animation: spin .8s linear infinite; }
    .label { align-items: center; gap: 4px; letter-spacing: -0.01em; }
    .mark { width: 16px; height: 16px; }
    .sep { width: 1px; height: 14px; background: var(--line-2); }
    .rewrite { color: var(--fg-2); align-items: center; gap: 4px; }
    .pill[data-state="select"]:hover .rewrite, .pill.open .rewrite { color: var(--fg); }
    .chev { width: 14px; height: 14px; transition: transform .15s; }
    .pill.open .chev { transform: rotate(180deg); }
    body.top .chev { transform: rotate(180deg); }
    body.top .pill.open .chev { transform: none; }
    .cancel { width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; color: var(--fg-2); }
    .cancel:hover { background: var(--bg-3); color: var(--fg); }
    .cancel svg { width: 14px; height: 14px; }

    /* ---- the Rewrite menu ---- */
    .menu { width: 256px; max-height: 420px; overflow-y: auto; padding: 4px; border-radius: var(--radius-lg); background: var(--bg);
      border: 1px solid var(--line-2); box-shadow: 0 10px 28px rgba(0, 0, 0, .45); box-sizing: border-box; }
    .menu-head { padding: 8px 10px 6px; font: 500 11px/1 var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
    .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
    .menu button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px;
      align-items: center; padding: 8px 10px; border-radius: var(--radius); }
    .menu button:hover { background: var(--bg-3); }
    .menu svg { width: 16px; height: 16px; color: var(--fg-2); }
    .menu button:hover svg { color: var(--fg); }
    .menu b { font-weight: 500; font-size: 13px; }
    .menu small { grid-column: 2; color: var(--fg-3); font-size: 12px; font-weight: 400; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu button > * { min-width: 0; }
    .menu::-webkit-scrollbar { width: 8px; }
    .menu::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }

    svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="menu" id="menu" hidden></div>

  <button class="pill" id="pill" data-state="idle" tabindex="-1">
    <svg class="mark" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    <span class="dot"></span>
    <canvas id="wave" width="96" height="22"></canvas>
    <span class="spinner"></span>
    <span class="label" id="label"></span>
    <span class="timer mono" id="timer"></span>
    <span class="sep"></span>
    <span class="rewrite">Rewrite<svg class="chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></span>
    <span class="cancel" id="cancel" title="Cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
  </button>

  <script src="../../node_modules/onnxruntime-web/dist/ort.wasm.min.js"></script>
  <script src="vad.js"></script>
  <script src="pill.js"></script>
</body>
</html>
